[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pacegame"
version = "0.2.11"
description = "Continuous-time sequential entry games with signalling, solved and verified"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Na Li", email = "11477@zzrvtc.edu.cn"},
]
keywords = ["game theory", "entry timing", "preannouncement", "comparative statics",
            "symbolic computation", "reproducibility", "research software"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["sympy>=1.12"]

[project.optional-dependencies]
figures = ["matplotlib>=3.5"]

[project.scripts]
pacegame = "pacegame.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["pacegame"]

[tool.hatch.build.targets.sdist]
include = ["/pacegame", "/examples", "/docs", "/.github", "/README.md",
           "/LICENSE", "/CHANGELOG.md", "/pyproject.toml", "/INPUT_PROVENANCE.json",
           "/requirements-reproduce.txt", "/requirements-core.txt", "/requirements-reproduce-lock.txt"]

[project.urls]
Repository = "https://github.com/NaLi11477/PACEgame"
Documentation = "https://github.com/NaLi11477/PACEgame#readme"
DOI = "https://doi.org/10.5281/zenodo.23295744"
