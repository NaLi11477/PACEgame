name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install build hatchling
      - run: python -m compileall -q examples pacegame
      - run: python -m build --wheel --no-isolation
      - name: Install wheel and plotting extra
        run: python -c "import glob,subprocess,sys; subprocess.check_call([sys.executable,'-m','pip','install',glob.glob('dist/*.whl')[0]+'[figures]'])"
      - name: Test installed wheel outside checkout
        run: python -c "import subprocess,sys,tempfile; subprocess.check_call([sys.executable,'-m','pacegame.tests'],cwd=tempfile.mkdtemp())"
      - name: Validate installed release and all audit groups outside checkout
        run: python -c "import subprocess,sys,tempfile; folder=tempfile.mkdtemp(); [subprocess.check_call([sys.executable,'-m','pacegame.examples.'+module,'validation'],cwd=folder) for module in ['validate_release','validate_audit_021','validate_audit_022','validate_audit_023','validate_audit_024','validate_audit_025','validate_audit_026','validate_audit_027','validate_audit_028','validate_audit_029','validate_audit_0210','validate_audit_0211']]"
      - name: Inspect and plot installed examples outside checkout
        run: python -c "import subprocess,sys,tempfile; folder=tempfile.mkdtemp(); subprocess.check_call([sys.executable,'-m','pacegame.examples.audit_preannouncement'],cwd=folder); subprocess.check_call([sys.executable,'-m','pacegame.examples.make_figures','figures'],cwd=folder)"
